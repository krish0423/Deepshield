<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepShield Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="settings-container">
    <h2>Settings</h2>
    <form id="settings-form">
      <label>API Endpoint:<br>
        <input type="text" id="api-endpoint" name="api-endpoint" placeholder="http://127.0.0.1:5000/predict">
      </label>
      <label>Real Threshold:<br>
        <input type="number" id="real-threshold" name="real-threshold" min="0" max="1" step="0.01">
      </label>
      <label>Fake Threshold:<br>
        <input type="number" id="fake-threshold" name="fake-threshold" min="0" max="1" step="0.01">
      </label>
      <button type="submit">Save Settings</button>
      <button type="button" id="reset-settings">Reset to Default</button>
    </form>
    <hr>
    <button id="open-history">View Analysis History</button>
    <button id="clear-history">Clear History</button>
  </div>
  <script src="settings.js"></script>
</body>
</html>
